<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Image Enhancer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>✨ AI Image Enhancer</h1>

        <p class="subtitle">
            Enhance and upscale your images with AI
        </p>

        <div class="upload-box">

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <label for="imageInput">
                🖼️ Choose an Image
            </label>

        </div>

        <div id="status">
            Select an image to begin.
        </div>

        <div class="preview">

            <div class="preview-box">
                <h3>Original</h3>
                <img id="previewImage" alt="Original image">
            </div>

            <div class="preview-box">
                <h3>Enhanced</h3>
                <img id="resultImage" alt="Enhanced image">
            </div>

        </div>

        <div class="controls">

            <label>
                Brightness
                <input
                    type="range"
                    id="brightness"
                    min="50"
                    max="150"
                    value="100"
                >
            </label>

            <label>
                Contrast
                <input
                    type="range"
                    id="contrast"
                    min="50"
                    max="150"
                    value="100"
                >
            </label>

            <label>
                Saturation
                <input
                    type="range"
                    id="saturation"
                    min="50"
                    max="150"
                    value="100"
                >
            </label>

        </div>

        <div class="buttons">

            <button id="aiBtn">
                🤖 AI 2× Upscale
            </button>

            <button id="enhanceBtn">
                ✨ Enhance
            </button>

            <button id="downloadBtn">
                ⬇️ Download
            </button>

        </div>

        <canvas id="canvas"></canvas>

    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
